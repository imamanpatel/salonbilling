# Nginx site for Sabilling. Copy to /etc/nginx/sites-available/sabilling and replace:
#   billing.example.com          -> your domain
#   /home/sabilling/salonbilling -> where you cloned the repo
# Then `sudo certbot --nginx -d billing.example.com` adds HTTPS (required: the login cookie is HTTPS-only).

server {
    listen 80;
    listen [::]:80;
    server_name billing.example.com;

    # The built web app (npm run build).
    root /home/sabilling/salonbilling/apps/web/dist;
    index index.html;

    # Excel imports are up to 5 MB, gallery uploads up to 10 × 2 MB.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Offer and gallery images, served by the API.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 30d;
    }

    # Hashed JS/CSS from Vite never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a page of the single-page app (including /book/<branch>).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
